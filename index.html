<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/jpeg" href="uploads/Gemini_Generated_Image_vfajs3vfajs3vfaj.jpeg" />
    <title>Carloss - Previsão do Tempo</title>
</head>

<body>
    <div class="caixa-maior">
        <div class="caixa-logo">
            <img class="logo" src="uploads/Gemini_Generated_Image_vfajs3vfajs3vfaj.jpeg" alt="Logo Samuel Kids" />
        </div>

        <input class="input-cidade" placeholder="Digite a cidade" />

        <button onclick="cliqueiNoBotao()">
            <img class="lupa" src="https://www.svgrepo.com/show/390590/find-glass-minus-online-search-seo.svg" />
        </button>

        <div class="caixa-media">
            <h2 class="cidade">Tempo em São Paulo</h2>

            <p class="temp">28°C</p>

            <img class="icone" src="https://openweathermap.org/img/wn/04n.png" />

            <p class="umidade">Umidade: 70%</p>

            <p class="desenvolvedor">Developed by: Carlos Augusto</p>
        </div>
    </div>
<script src="scripts.js"></script>
</body>

</html>
